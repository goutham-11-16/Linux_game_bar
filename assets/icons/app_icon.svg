<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181c"/>
      <stop offset="100%" stop-color="#0d0d0f"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#139813"/>
      <stop offset="100%" stop-color="#107C10"/>
    </linearGradient>
  </defs>
  <!-- Background rounded squircle -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad)" stroke="#107C10" stroke-width="3"/>
  <!-- Glowing Xbox-inspired circle -->
  <circle cx="64" cy="64" r="38" fill="none" stroke="url(#greenGrad)" stroke-width="6"/>
  <!-- Xbox X Cross Curve -->
  <path d="M 44 44 C 54 54, 54 54, 64 64 C 54 74, 54 74, 44 84" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
  <path d="M 84 44 C 74 54, 74 54, 64 64 C 74 74, 74 74, 84 84" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
  <!-- Center Glow Dot -->
