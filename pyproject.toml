[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "linux-game-bar"
version = "1.0.0"
description = "Xbox Game Bar-inspired overlay for Ubuntu GNOME"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Project Linux Game Bar Authors"}
]
dependencies = [
    "PySide6>=6.5.0",
    "psutil>=5.9.0",
]

[project.scripts]
linux-game-bar = "linux_game_bar.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
pythonpath = ["src"]
addopts = "-v"
