name: linux-game-bar
base: core24
version: '1.0.0'
summary: Xbox Game Bar-inspired gaming overlay & widget utility for Linux
title: Linux Game Bar
description: |
  Linux Game Bar is an Xbox Game Bar-inspired in-game overlay and widget
  utility built for Linux and Ubuntu GNOME desktops.

  Key Features:
  - Global Super + G overlay summonable anytime without quitting games
  - Real-time Performance Monitor tracking CPU, GPU, RAM, VRAM, and FPS
  - Fluent 2 Audio Mixer with per-app volume sliders and device selection
  - Screen Capture & Gallery with instant screenshot preview and copy
  - Embedded Game Browser with dedicated private profile and Google login support
  - Auto-Typer utility for custom hotkey expansion and automated text injection
  - 1-Click Widget Store & Extensible Python SDK to install community widgets from GitHub or ZIP archives

grade: stable
confinement: classic
license: MIT
icon: assets/icons/app_icon.png
website: https://github.com/goutham-11-16/Linux_game_bar
contact: https://github.com/goutham-11-16/Linux_game_bar/issues

apps:
  linux-game-bar:
    command: bin/linux-game-bar
    desktop: usr/share/applications/linux-game-bar.desktop
    environment:
      PATH: $SNAP/usr/bin:$SNAP/bin:$PATH
      LD_LIBRARY_PATH: $SNAP/usr/lib/$SNAPCRAFT_ARCH_TRIPLET:$SNAP/usr/lib:$LD_LIBRARY_PATH
      QT_QPA_PLATFORM: wayland;xcb

parts:
  desktop-entry:
    plugin: dump
    source: packaging/
    organize:
      linux-game-bar.desktop: usr/share/applications/linux-game-bar.desktop
    stage:
      - usr/share/applications/linux-game-bar.desktop

  linux-game-bar:
    plugin: nil
    source: .
    build-packages:
      - python3
      - python3-pip
      - python3-venv
    stage-packages:
      - python3
      - python3-venv
      - libgl1
      - libxkbcommon0
      - libegl1
      - libpulse0
      - libasound2t64
      - ydotool
      - xdotool
      - git
    override-build: |
      # 1. Create a dedicated virtualenv inside the snap payload
      python3 -m venv "$CRAFT_PART_INSTALL/usr/venv"
      
      # 2. Install pip dependencies
      "$CRAFT_PART_INSTALL/usr/venv/bin/pip" install --upgrade pip
      "$CRAFT_PART_INSTALL/usr/venv/bin/pip" install -r requirements.txt
      "$CRAFT_PART_INSTALL/usr/venv/bin/pip" install .
      
      # 3. Copy source and assets
      mkdir -p "$CRAFT_PART_INSTALL/src" "$CRAFT_PART_INSTALL/assets" "$CRAFT_PART_INSTALL/config"
      cp -r src/* "$CRAFT_PART_INSTALL/src/"
      cp -r assets/* "$CRAFT_PART_INSTALL/assets/"
      cp -r config/* "$CRAFT_PART_INSTALL/config/"
      
      # 4. Create launch wrapper script
      mkdir -p "$CRAFT_PART_INSTALL/bin"
      cat << 'WRAPPER' > "$CRAFT_PART_INSTALL/bin/linux-game-bar"
      #!/usr/bin/env bash
      export PYTHONPATH="$SNAP/src:$SNAP/usr/venv/lib/python3.12/site-packages"
      exec "$SNAP/usr/venv/bin/python3" -m linux_game_bar "$@"
      WRAPPER
      chmod +x "$CRAFT_PART_INSTALL/bin/linux-game-bar"
